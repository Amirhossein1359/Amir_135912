<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت فروشگاهی حرفه‌ای</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>فروشگاه امیر</h1>
        </div>
        <div class="cart">
            <button id="cart-button">سبد خرید (0)</button>
        </div>
    </header>

    <div class="product-container">
        <div class="product">
            <img src="images/product1.jpg" alt="Product 1">
            <h2>محصول 1</h2>
            <p>قیمت: 300 تومان</p>
            <button onclick="addToCart(1, 'محصول 1', 300)">افزودن به سبد خرید</button>
        </div>
        <div class="product">
            <img src="images/product2.jpg" alt="Product 2">
            <h2>محصول 2</h2>
            <p>قیمت: 400 تومان</p>
            <button onclick="addToCart(2, 'محصول 2', 400)">افزودن به سبد خرید</button>
        </div>
        <!-- افزودن محصولات بیشتر -->
    </div>

    <div class="cart-modal" id="cart-modal">
        <div class="cart-modal-content">
            <h2>سبد خرید</h2>
            <table id="cart-table">
                <!-- محصولات سبد خرید در اینجا اضافه می‌شوند -->
            </table>
            <p>قیمت کل: <span id="total-price">0</span> تومان</p>
            <input type="text" id="discount-code" placeholder="کد تخفیف">
            <button onclick="applyDiscount()">اعمال تخفیف</button>
            <button onclick="checkout()">خرید</button>
            <button onclick="closeCart()">بستن</button>
        </div>
    </div>

    <script src="js/scripts.js"></script>
</body>
</html>
