<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سبد خرید</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>سبد خرید</h1>
    </header>

    <section id="cart-container">
        <table id="cart-table">
            <thead>
                <tr>
                    <th>محصول</th>
                    <th>قیمت</th>
                    <th>تعداد</th>
                    <th>مجموع</th>
                    <th>حذف</th>
                </tr>
            </thead>
            <tbody id="cart-items">
                <!-- کالاهای سبد خرید در اینجا قرار می‌گیرند -->
            </tbody>
        </table>

        <div id="cart-total">
            <h2>جمع کل: <span id="total-price">0</span> تومان</h2>
            <button id="checkout-btn">پرداخت</button>
        </div>
    </section>

    <footer>
        <p>تمامی حقوق محفوظ است</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
